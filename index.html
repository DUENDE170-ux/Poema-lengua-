const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const playBtn = document.getElementById('play');
let current = 0;
let playing = true;
let timer = null;

slides.forEach((s, i) => {
  const img = document.createElement('img');
  img.className = 'slide' + (i === 0 ? ' active' : '');
  img.src = s.src;
  img.alt = 'Diapositiva ' + (i + 1);
  stage.appendChild(img);
});

const elements = [...document.querySelectorAll('.slide')];

function show(i) {
  current = (i + slides.length) % slides.length;
  elements.forEach((el, n) => el.classList.toggle('active', n === current));
  counter.textContent = `${current + 1} / ${slides.length}`;
}

function schedule() {
  clearTimeout(timer);
  if (!playing) return;
  timer = setTimeout(() => {
    show(current + 1);
    schedule();
  }, slides[current].duration);
}

document.getElementById('next').onclick = () => { show(current + 1); schedule(); };
document.getElementById('prev').onclick = () => { show(current - 1); schedule(); };
playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? '❚❚' : '▶';
  schedule();
};

stage.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '❚❚' : '▶';
  schedule();
});

schedule();
</script>
